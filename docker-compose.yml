services:
  web:
    image: standardnotes/web:latest@sha256:4925aae628a4e27e894208e4948d84733158c6f37ff1f20f0c6d46d13a670b4b
    command: /opt/standard-notes/web-entrypoint.sh
    ports:
      - "127.0.0.1:8098:80"
    healthcheck:
      test: [CMD, wget, --quiet, --spider, http://127.0.0.1/]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./web-entrypoint.sh:/opt/standard-notes/web-entrypoint.sh:ro

  server:
    image: standardnotes/server:latest@sha256:cad73dd95394ed871b049553a2a8917cbc0d2656190af7e8b27833b4d69a1ef7
    env_file:
      - /etc/homeserver/standard-notes.env
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      localstack:
        condition: service_started
    ports:
      - "127.0.0.1:8096:3000"
      - "127.0.0.1:8097:3104"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 1m
    volumes:
      - ./logs:/var/lib/server/logs
      - ./uploads:/opt/server/packages/files/dist/uploads

  localstack:
    image: localstack/localstack:4.14@sha256:3ebc37595918b8accb852f8048fef2aff047d465167edd655528065b07bc364a
    environment:
      SERVICES: sns,sqs
      HOSTNAME_EXTERNAL: localstack
      LS_LOG: warn
    expose:
      - "4566"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./localstack_bootstrap.sh:/etc/localstack/init/ready.d/localstack_bootstrap.sh:ro

  db:
    image: mysql:26@sha256:3819b2b23835c4a73c8b022fafc33c8095c0f81c929a8b7a84613d2fba6c52f5
    env_file:
      - /etc/homeserver/standard-notes.env
    expose:
      - "3306"
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping --host=127.0.0.1 --user="$${MYSQL_USER}" --password="$${MYSQL_PASSWORD}" --silent
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 1m
    volumes:
      - ./data/mysql:/var/lib/mysql

  cache:
    image: redis:8.0-alpine@sha256:5f61955be8ab2ccee9372b84ae4d4da2e2b156f87281e3f218544055e7ee04d4
    command: redis-server --appendonly yes
    expose:
      - "6379"
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./data/redis:/data
